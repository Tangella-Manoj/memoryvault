<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MemoryVault</title>
  <style>
    body { width: 260px; font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; color: #1a2332; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #2d6a6a; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #f1f5f9; color: #334155; margin-top: 6px; }
    .error { color: #b91c1c; font-size: 12px; margin: 4px 0; }
    .status { font-size: 12px; color: #64748b; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>MemoryVault</h1>
  <div id="loggedOutView">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <div id="loginError" class="error"></div>
    <button id="loginBtn">Log in</button>
  </div>
  <div id="loggedInView" style="display:none">
    <p class="status" id="whoami"></p>
    <p class="status" id="pending"></p>
    <button id="saveBtn">Save this page</button>
    <button id="logoutBtn" class="secondary">Log out</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
