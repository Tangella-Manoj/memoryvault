spring:
  # Render provides a single DATABASE_URL in the form postgres://user:pass@host:port/db.
  # Spring's own datasource.url property wants the jdbc: form, so it's assembled from the
  # individual DB_* vars below instead of parsed from DATABASE_URL directly.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 600000
      idle-timeout: 300000
      keepalive-time: 120000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://memoryvault.stacknode.dev}
  frontend-base-url: ${FRONTEND_BASE_URL:https://memoryvault.stacknode.dev}
  auth:
    expose-reset-code: ${EXPOSE_RESET_CODE:false}

