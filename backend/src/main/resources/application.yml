spring:
  application:
    name: memoryvault-backend
  profiles:
    active: ${SPRING_PROFILE:dev}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:${PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        # Note: only /actuator/health is in SecurityConfig's permitAll list.
        # scheduledtasks and behaviorLearner endpoints require valid authentication.
        include: health,scheduledtasks,behaviorLearner

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000} # 15 minutes (was 24h)
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:llama-3.1-8b-instant}
    huggingface:
      api-key: ${HUGGINGFACE_API_KEY:}
      embedding-model: ${HUGGINGFACE_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
  vault-email-domain: ${VAULT_EMAIL_DOMAIN:vault.stacknode.dev}
  smtp-receiver:
    enabled: ${SMTP_RECEIVER_ENABLED:true}
    port: ${SMTP_RECEIVER_PORT:2525}
  mailgun:
    webhook-signing-key: ${MAILGUN_WEBHOOK_SIGNING_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8091/api/integrations/youtube/callback}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  encryption:
    key: ${TOKEN_ENCRYPTION_KEY:}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@memoryvault.dev}
  mail:
    from: ${MAIL_FROM:MemoryVault <onboarding@resend.dev>}
    from-name: ${MAIL_FROM_NAME:MemoryVault}
    resend-api-key: ${RESEND_API_KEY:}
    mailgun-api-key: ${MAILGUN_API_KEY:}
    mailgun-domain: ${MAILGUN_DOMAIN:}
    smtp:
      host: ${SMTP_HOST:${SPRING_MAIL_HOST:${MAIL_HOST:}}}
      port: ${SMTP_PORT:${SPRING_MAIL_PORT:${MAIL_PORT:587}}}
      username: ${SMTP_USERNAME:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}}
      password: ${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}}
      auth: ${SMTP_AUTH:true}
      starttls: ${SMTP_STARTTLS:true}
      ssl: ${SMTP_SSL:false}
  auth:
    expose-reset-code: ${EXPOSE_RESET_CODE:true}

