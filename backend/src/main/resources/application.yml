spring:
  application:
    name: memoryvault-backend
  profiles:
    active: ${SPRING_PROFILE:dev}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,scheduledtasks

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:86400000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
