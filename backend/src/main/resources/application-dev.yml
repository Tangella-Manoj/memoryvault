spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:33061}/${DB_NAME:memoryvault}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:memoryvault_app}
    password: ${DB_PASSWORD:local_app_pw_dev_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
